<!DOCTYPE html>
<html >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penman Editor Example</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body { box-sizing: border-box; font-family: 'vazirmatn', sans-serif; padding: 20px; background-color: #f9f9f9; min-height: 100vh; 
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }
    .main { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgb(64, 113, 162,0.06) }
    /* All internal styles are now bundled in src/styles via index.js */
  </style>
</head>
<body>
  <div class="main">
    <h1>Short Story Editor (RTL)</h1>
    <textarea class="mytextarea" name="shortstory" data-height="250" data-direction="rtl"><p>متن مقاله را اینجا وارد کنید</p></textarea>
  </div>

  <div class="main">
    <h1>Full Story Editor (LTR)</h1>
    <textarea class="mytextarea" name="fullstory" data-height="400" data-direction="ltr"><p>Enter your full story here</p></textarea>
  </div>

  <!-- Load the built script -->
  <script type="module">
    import penman from './src/index.js';

    // Assign to window for console access if needed, simulating real usage
    // window.penman = penman;

    // Define the global default configurations
    const penmanDefaults = {
      lang: 'fa',
      plugins: ['link', 'draft', 'suggestedposts', 'format', 'list', 'blocktype', 'fontsize', 'removeformat', 'hr', 'findreplace', 'table', 'image', 'color', 'sourcecode', 'direction', 'media'],
      toolbar: {
        rows: [
          ['undo', 'redo', 'blocktype', 'fontsize', 'suggestedposts', 'dirrtl', 'dirltr','findreplace', 'sourcecode', 'hr'], 
          ['bold', 'italic', 'underline','strikethrough', 'justifyright', 'justifycenter', 'justifyleft', 'justifyfull', 'bullist', 'numlist', 'link', 'unlink', 'image', 'media', 'table', 'removeformat', 'textcolor', 'highlight'],
        ]
      },
      blockTypes: [
        { name: 'Paragraph', cmd: 'p' },
        { name: 'Heading 2', cmd: 'h2' },
        { name: 'Heading 3', cmd: 'h3' },
        { name: 'Heading 4', cmd: 'h4' },
        { name: 'Heading 5', cmd: 'h5' },
        { name: 'Heading 6', cmd: 'h6' },
        { name: 'Quote', cmd: 'blockquote' },
        { name: 'Success', cmd: 'div', class: 'green-block', optionStyle: { color: '#166534', background: '#dcfce7', fontWeight: 'bold', borderRight: '3px solid #22c55e' } },
        { name: 'Info', cmd: 'div', class: 'blue-block', optionStyle: { color: '#1e3a8a', background: '#dbeafe', fontWeight: 'bold', borderRight: '3px solid #3b82f6' } },
        { name: 'Warning', cmd: 'div', class: 'orange-block', optionStyle: { color: '#9a3412', background: '#ffedd5', fontWeight: 'bold', borderRight: '3px solid #f97316' } },
        { name: 'Danger', cmd: 'div', class: 'red-block', optionStyle: { color: '#7f1d1d', background: '#fee2e2', fontWeight: 'bold', borderRight: '3px solid #ef4444' } }
      ],
      imageUploadFn: (file, onProgress) => {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/upload', true);

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable && onProgress) {
              onProgress(e.loaded, e.total);
            }
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const data = JSON.parse(xhr.responseText);
                resolve({
                  url: data.url,
                  alt: file.name
                });
              } catch (err) {
                reject(new Error('Invalid JSON response'));
              }
            } else {
              reject(new Error('Upload failed with status: ' + xhr.status));
            }
          };

          xhr.onerror = () => {
            reject(new Error('Network error during upload'));
          };

          const formData = new FormData();
          formData.append('file', file);
          xhr.send(formData);
        });
      }
    };

    // Initialize all matching editors dynamically, using data attributes to customize behavior per-editor
    penman.init({
      selector: '.mytextarea',
      config: penmanDefaults,
      resolveConfig: (el, defaultConfig) => {
        return {
          ...defaultConfig,
          height: parseInt(el.dataset.height, 10) || 300,
          direction: el.dataset.direction || 'auto',
          lang: el.dataset.direction === 'rtl' ? 'fa' : 'en' // Override language based on direction for better defaults
        };
      }
    });

    const allInstances = penman.getAll();

    allInstances.forEach(instance => {
      // 👇 ثبت گالری در پلاگین تصویر (برای نمایش فایل‌های پوشه server/uploads)
      if (instance.image && instance.image.gallery) {
        instance.image.gallery.registerSource({
          id: 'local-uploads',
          name: 'Local Uploads',
          trustLevel: 'TRUSTED', // Since it comes from our own server
          list: async (cursor = null, limit = 20) => {
            // در سرور local که راه‌اندازی کردیم، endpoint به نام /gallery ایجاد کردیم
            const response = await fetch('http://localhost:3000/gallery');
            const data = await response.json();
            return data; // { items: [...], nextCursor: null }
          },
          get: async (id) => {
            // در این مثال ساده get به صورت dummy کار می‌کند چون لیست همه فیلدها را دارد
            return { id, url: `http://localhost:3000/uploads/${id}` };
          }
        });
      }
    });

  </script>
</body>
</html>
