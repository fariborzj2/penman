<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penman Editor Example</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .penman-editor {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Penman Editor Example</h1>

  <form id="myForm">
    <textarea name="fullstory" id="myTextarea">Initial content in textarea.</textarea>
  </form>

  <!-- Load the built script -->
  <script src="dist/penman.umd.js"></script>

  <script>
    // Initialize the editor
    const editor = penman.init({
      selector: '#myTextarea',
      lang: 'en',
      direction: 'ltr',
      height: 200
    });

    // Listen to changes to verify sync
    const textarea = document.getElementById('myTextarea');
    setInterval(() => {
        console.log("Textarea value:", textarea.value);
    }, 5000);
  </script>
</body>
</html>
