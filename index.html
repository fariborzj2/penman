<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penman Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 20px;
      background: linear-gradient(135deg, #f0f4ff 0%, #fafbff 50%, #f5f0ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 32px;
      align-items: center;
      font-size: 13px;
      direction: rtl;
    }

    /* Page header */
    .page-header {
      text-align: center;
      max-width: 600px;
    }
    .page-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 8px;
      letter-spacing: -0.03em;
    }
    .page-header p {
      color: #64748b;
      font-size: 15px;
      margin: 0;
    }

    /* Editor card */
    .editor-card {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(79, 110, 247, 0.07), 0 1px 4px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    .editor-card-header {
      padding: 16px 20px 14px;
      border-bottom: 1px solid #f0f2f8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .editor-card-header h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .editor-card-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: 0.03em;
    }

    .badge-rtl {
      background: #eff6ff;
      color: #3b82f6;
    }

    .badge-ltr {
      background: #f0fdf4;
      color: #16a34a;
    }

    .editor-card-body {
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Penman Editor</h1>
    <p>ویرایشگر متن غنی نسل جدید با معماری مدرن، عملکرد سریع و رابط کاربری روان؛ طراحی‌شده برای تولید و مدیریت محتوا بدون وابستگی خارجی و با تمرکز بر توسعه‌پذیری، پایداری و تجربه کاربری حرفه‌ای.</p>
  </div>

  <div class="editor-card">
    <div class="editor-card-header">
      <h2>ویرایشگر فارسی</h2>
      <span class="editor-card-badge badge-rtl">RTL</span>
    </div>
    <div class="editor-card-body">
      <textarea class="mytextarea" name="shortstory" data-height="280" data-direction="rtl"><p>متن مقاله را اینجا وارد کنید</p></textarea>
    </div>
  </div>

  <div class="editor-card" dir="ltr">
    <div class="editor-card-header">
      <h2>English Editor</h2>
      <span class="editor-card-badge badge-ltr">LTR</span>
    </div>
    <div class="editor-card-body">
      <textarea class="mytextarea" name="fullstory" data-height="380" data-direction="ltr"><p>Enter your full story here</p></textarea>
    </div>
  </div>

  <!-- Load the built script -->
  <script type="module">
    import penman from './src/index.js';

    // Assign to window for console access if needed, simulating real usage
    // window.penman = penman;

    // Define the global default configurations
    const penmanDefaults = {
      lang: 'fa',
      plugins: ['embed', 'link', 'draft', 'suggestedposts', 'format', 'list', 'blocktype', 'fontsize', 'removeformat', 'hr', 'findreplace', 'table', 'image', 'color', 'sourcecode', 'direction', 'media', 'codeblock', 'markdown'],
      toolbar: {
        rows: [
          ['undo', 'redo', 'blocktype', 'fontsize', 'image', 'media', 'embed', 'table', 'suggestedposts', 'dirrtl', 'dirltr','findreplace', 'sourcecode', 'hr', 'codeblock'], 
          ['bold', 'italic', 'underline','strikethrough', 'superscript', 'subscript', 'justifyright', 'justifycenter', 'justifyleft', 'justifyfull', 'bullist', 'numlist', 'indentlist', 'outdentlist', 'link', 'unlink', 'removeformat', 'textcolor', 'highlight'],
        ]
      },
      imageUploadFn: (file, onProgress) => {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/upload', true);

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable && onProgress) {
              onProgress(e.loaded, e.total);
            }
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const data = JSON.parse(xhr.responseText);
                resolve({
                  url: data.url,
                  alt: file.name
                });
              } catch (err) {
                reject(new Error('Invalid JSON response'));
              }
            } else {
              reject(new Error('Upload failed with status: ' + xhr.status));
            }
          };

          xhr.onerror = () => {
            reject(new Error('Network error during upload'));
          };

          const formData = new FormData();
          formData.append('file', file);
          xhr.send(formData);
        });
      }
    };

    // Initialize all matching editors dynamically, using data attributes to customize behavior per-editor
    penman.init({
      selector: '.mytextarea',
      config: penmanDefaults,
      resolveConfig: (el, defaultConfig) => {
        return {
          ...defaultConfig,
          height: parseInt(el.dataset.height, 10) || 300,
          direction: el.dataset.direction || 'auto',
          lang: el.dataset.direction === 'rtl' ? 'fa' : 'en' // Override language based on direction for better defaults
        };
      }
    });

    const allInstances = penman.getAll();

    allInstances.forEach(instance => {
      // 👇 ثبت گالری در پلاگین تصویر (برای نمایش فایل‌های پوشه server/uploads)
      if (instance.image && instance.image.gallery) {
        instance.image.gallery.registerSource({
          id: 'local-uploads',
          name: 'Local Uploads',
          trustLevel: 'TRUSTED', // Since it comes from our own server
          list: async (cursor = null, limit = 20) => {
            // در سرور local که راه‌اندازی کردیم، endpoint به نام /gallery ایجاد کردیم
            const response = await fetch('http://localhost:3000/gallery');
            const data = await response.json();
            return data; // { items: [...], nextCursor: null }
          },
          get: async (id) => {
            // در این مثال ساده get به صورت dummy کار می‌کند چون لیست همه فیلدها را دارد
            return { id, url: `http://localhost:3000/uploads/${id}` };
          }
        });
      }
    });

  </script>
</body>
</html>
