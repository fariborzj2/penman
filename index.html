<!DOCTYPE html>
<html >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penman Editor Example</title>
  <style>
    body { box-sizing: border-box; font-family: sans-serif; padding: 20px; background-color: #f9f9f9; height: 100vh; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .main { width: 100%; max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; border: 1px solid #E2E8F0; }
    /* All internal styles are now bundled in src/styles via index.js */
  </style>
</head>
<body>
  <div class="main">
    <h1>Penman Editor Example</h1>
    <textarea name="fullstory" id="myTextarea"><p>متن مقاله را اینجا وارد کنید</p></textarea>
  </div>

  <svg width="20" height="20" focusable="false" viewBox="0 0 24 24"><path d="M 514.25183,32.312286 C 462.60025,45.101496 371.31924,46.452526 290.41665,36.354476 C 214.66567,33.966956 32.54136,14.648006 32.2604,209.54198 C 31.97944,405.4461 231.17596,389.05565 290.41665,392.63573 C 292.7273,441.3511 291.72308,654.51476 290.41665,702.41698 C 246.34903,721.94286 167.80215,759.60919 244.91269,758.95917 L 499.67695,758.95917 C 580.35791,759.03405 498.28983,719.68404 462.2604,702.41698 L 462.2604,85.010726 C 492.80976,82.152126 537.97093,55.651886 514.25183,32.312286 z M 403.15649,87.229476 L 403.15649,701.40683 C 382.26237,716.55909 370.45445,715.54896 348.55022,702.41698 L 348.55022,85.209166 C 372.92675,85.209166 376.9657,86.345606 403.15649,87.229476 z M 290.41665,84.666976 L 290.41665,339.92555 C 246.64853,339.37261 101.07965,334.12564 102.74089,217.01073 C 104.29829,108.16251 185.87658,86.464636 290.41665,84.666976 z " style="fill:#000000;fill-opacity:1;fill-rule:evenodd;stroke:#000000;stroke-width:1.2;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1"/></svg>
  

  <!-- Load the built script -->
  <script type="module">
    import penman from './src/index.js';

    // Assign to window for console access if needed, simulating real usage
    // window.penman = penman;

    // Initialize the editor
    penman.init({
      selector: '#myTextarea',
      lang: 'en',
      direction: 'rtl',
      height: 300,
      plugins: ['link', 'draft', 'format', 'list', 'blocktype', 'fontsize', 'unlink', 'removeformat', 'hr', 'findreplace', 'table', 'image', 'color', 'sourcecode', 'direction'],
      toolbar: 'undo redo | blocktype fontsize  dirrtl dirltr | bold italic underline strikethrough textcolor highlight | justifyleft justifycenter justifyright justifyfull | bullist numlist | link unlink image | hr removeformat | findreplace | table sourcecode',
      blockTypes: [
        { name: 'Paragraph', cmd: 'p' },
        { name: 'Subheading', cmd: 'h3' },
        { name: 'Quote', cmd: 'blockquote' },
        {
          name: 'Warning',
          cmd: 'div',
          class: 'warning-block',
          optionStyle: { color: '#c73a3a', background: '#fde3e3', fontWeight: 'bold' , borderRight: '2px solid #c73a3a' }
        }
      ],
      imageUploadFn: (file, onProgress) => {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', '/upload', true);

          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable && onProgress) {
              onProgress(e.loaded, e.total);
            }
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const data = JSON.parse(xhr.responseText);
                resolve({
                  url: data.url,
                  alt: file.name
                });
              } catch (err) {
                reject(new Error('Invalid JSON response'));
              }
            } else {
              reject(new Error('Upload failed with status: ' + xhr.status));
            }
          };

          xhr.onerror = () => {
            reject(new Error('Network error during upload'));
          };

          const formData = new FormData();
          formData.append('file', file);
          xhr.send(formData);
        });
      }
    });

    const instance = penman.get('#myTextarea');

    // 👇 ثبت گالری در پلاگین تصویر (برای نمایش فایل‌های پوشه server/uploads)
    if (instance.image && instance.image.gallery) {
      instance.image.gallery.registerSource({
        id: 'local-uploads',
        name: 'Local Uploads',
        trustLevel: 'TRUSTED', // Since it comes from our own server
        list: async (cursor = null, limit = 20) => {
          // در سرور local که راه‌اندازی کردیم، endpoint به نام /gallery ایجاد کردیم
          const response = await fetch('http://localhost:3000/gallery');
          const data = await response.json();
          return data; // { items: [...], nextCursor: null }
        },
        get: async (id) => {
          // در این مثال ساده get به صورت dummy کار می‌کند چون لیست همه فیلدها را دارد
          return { id, url: `http://localhost:3000/uploads/${id}` };
        }
      });
    }
  </script>
</body>
</html>
