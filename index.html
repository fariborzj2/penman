<!DOCTYPE html>
<html >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penman Editor Example</title>
  <style>
    body { box-sizing: border-box; font-family: sans-serif; padding: 20px; background-color: #f5f5f5;}
    .main { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    /* All internal styles are now bundled in src/styles via index.js */
  </style>
</head>
<body>
  <div class="main">
    <h1>Penman Editor Example</h1>
    <form id="myForm">
      <textarea name="fullstory" id="myTextarea">متن مقاله را اینجا وارد کنید</textarea>
    </form>

    <div style="margin-top: 20px;">
      <button id="btnSetContent">Set Content</button>
      <button id="btnGetContent">Get Content (Alert)</button>
      <button id="btnFocus">Focus Editor</button>
      <button id="btnDestroy">Destroy Editor</button>
    </div>
  </div>
  

  <!-- Load the built script -->
  <script type="module">
    import penman from './src/index.js';

    // Assign to window for console access if needed, simulating real usage
    window.penman = penman;

    // Initialize the editor
    penman.init({
      selector: '#myTextarea',
      lang: 'fa',
      direction: 'rtl',
      height: 700,
      plugins: ['link', 'format', 'list', 'blocktype', 'fontsize', 'unlink', 'removeformat', 'hr', 'findreplace', 'table', 'image'],
      toolbar: 'undo redo | blocktype fontsize | bold italic underline strikethrough | justifyleft justifycenter justifyright justifyfull | bullist numlist | link unlink image | hr removeformat | findreplace | table',
      blockTypes: [
        { name: 'Paragraph', cmd: 'p' },
        { name: 'Subheading', cmd: 'h3' },
        { name: 'Quote', cmd: 'blockquote' },
        {
          name: 'Warning',
          cmd: 'div',
          class: 'warning-block',
          optionStyle: { color: '#c73a3a', background: '#fde3e3', fontWeight: 'bold' , borderRight: '2px solid #c73a3a' }
        }
      ],
      imageUploadFn: async (file) => {
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        return {
          url: data.url,
          alt: file.name
        };
      }
    });

    const instance = penman.get('#myTextarea');

    // 👇 ثبت گالری در پلاگین تصویر (برای نمایش فایل‌های پوشه server/uploads)
    if (instance.image && instance.image.gallery) {
      instance.image.gallery.registerSource({
        id: 'local-uploads',
        name: 'Local Uploads',
        trustLevel: 'TRUSTED', // Since it comes from our own server
        list: async (cursor = null, limit = 20) => {
          // در سرور local که راه‌اندازی کردیم، endpoint به نام /gallery ایجاد کردیم
          const response = await fetch('http://localhost:3000/gallery');
          const data = await response.json();
          return data; // { items: [...], nextCursor: null }
        },
        get: async (id) => {
          // در این مثال ساده get به صورت dummy کار می‌کند چون لیست همه فیلدها را دارد
          return { id, url: `http://localhost:3000/uploads/${id}` };
        }
      });
    }

    document.getElementById('btnSetContent').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.setContent('<p><b>This is dynamically set content!</b></p>');
    });

    document.getElementById('btnGetContent').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) alert("Editor Content: " + ed.getContent());
    });

    document.getElementById('btnFocus').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.focus();
    });

    document.getElementById('btnDestroy').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.destroy();
    });

    // Listen to changes to verify sync
    const textarea = document.getElementById('myTextarea');
    setInterval(() => {
        console.log("Textarea value:", textarea.value);
    }, 5000);
  </script>
</body>
</html>
