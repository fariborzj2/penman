<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penman Editor Example</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .penman-editor {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Penman Editor Example</h1>

  <form id="myForm">
    <textarea name="fullstory" id="myTextarea">Initial content in textarea.</textarea>
  </form>

  <div style="margin-top: 20px;">
    <button id="btnSetContent">Set Content</button>
    <button id="btnGetContent">Get Content (Alert)</button>
    <button id="btnFocus">Focus Editor</button>
    <button id="btnDestroy">Destroy Editor</button>
  </div>

  <!-- Load the built script -->
  <script type="module">
    import penman from './src/index.js';

    // Assign to window for console access if needed, simulating real usage
    window.penman = penman;

    // Register a sample plugin before initialization to demonstrate end-to-end functionality
    penman.PluginManager.add('myLinkPlugin', function(editor) {
      editor.ui.registry.addButton('link', {
        text: 'Insert Link',
        icon: '<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>',
        onAction: function() {
          const url = prompt("Enter link URL:");
          if (url) {
            editor.insertContent(`<a href="${url}">[Link]</a>`);
          }
        }
      });
    });

    // Initialize the editor
    penman.init({
      selector: '#myTextarea',
      lang: 'en',
      direction: 'ltr',
      height: 200,
      plugins: ['myLinkPlugin'],
      toolbar: 'bold italic underline | justifyleft justifycenter justifyright | link'
    });

    const instance = penman.get('#myTextarea');

    document.getElementById('btnSetContent').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.setContent('<p><b>This is dynamically set content!</b></p>');
    });

    document.getElementById('btnGetContent').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) alert("Editor Content: " + ed.getContent());
    });

    document.getElementById('btnFocus').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.focus();
    });

    document.getElementById('btnDestroy').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.destroy();
    });

    // Listen to changes to verify sync
    const textarea = document.getElementById('myTextarea');
    setInterval(() => {
        console.log("Textarea value:", textarea.value);
    }, 5000);
  </script>
</body>
</html>
