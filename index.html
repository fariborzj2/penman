<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penman Editor Example</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .penman-editor {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
      outline: none;
    }

    /* Base UI/Style improvements for Penman Editor */
    .penman-wrapper {
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
    }
    .penman-toolbar {
      padding: 5px;
      border-bottom: 1px solid #eee;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px;
      background: #f9f9f9;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }
    .penman-btn {
      background: none;
      border: 1px solid transparent;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .penman-btn:hover {
      background: #e9e9e9;
      border-color: #ccc;
    }
    .penman-btn-active {
      background: #d4e4ff;
      border-color: #a3c2ff;
      color: #0044cc;
    }
    .penman-editor-area {
      padding: 15px;
      outline: none;
      min-height: 200px;
    }
    .penman-separator {
      color: #ccc;
      user-select: none;
    }

    /* Dropdown Component Styles */
    .penman-dropdown {
      position: relative;
      display: inline-block;
    }
    .penman-dropdown-panel {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 150px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 1000;
      padding: 5px;
      margin-top: 2px;
    }

    /* BlockType Plugin Styles */
    .penman-blocktype-search {
      border: 1px solid #ccc;
      border-radius: 3px;
      outline: none;
    }
    .penman-blocktype-search:focus {
      border-color: #88aaff;
    }
    .penman-blocktype-item {
      border-radius: 2px;
    }

    /* RTL adjustments */
    [dir="rtl"] .penman-dropdown-panel {
      left: auto;
      right: 0;
    }
  </style>
</head>
<body>
  <h1>Penman Editor Example</h1>

  <form id="myForm">
    <textarea name="fullstory" id="myTextarea">Initial content in textarea.</textarea>
  </form>

  <div style="margin-top: 20px;">
    <button id="btnSetContent">Set Content</button>
    <button id="btnGetContent">Get Content (Alert)</button>
    <button id="btnFocus">Focus Editor</button>
    <button id="btnDestroy">Destroy Editor</button>
  </div>

  <!-- Load the built script -->
  <script type="module">
    import penman from './src/index.js';

    // Assign to window for console access if needed, simulating real usage
    window.penman = penman;

    // Register a simple custom plugin to test the Dropdown UI visually
    penman.PluginManager.add('testDropdown', function(editor) {
      editor.ui.registry.addDropdown('testdrop', {
        text: 'Dropdown',
        icon: '<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M6 9l6 6 6-6"></path></svg>',
        content: `
          <div style="padding: 5px; cursor: pointer;" onclick="alert('Option 1 clicked!')">Option 1</div>
          <div style="padding: 5px; cursor: pointer;" onclick="alert('Option 2 clicked!')">Option 2</div>
        `
      });
    });

    // Initialize the editor
    penman.init({
      selector: '#myTextarea',
      lang: 'fa',
      direction: 'rtl',
      height: 200,
      plugins: ['link', 'format', 'list', 'blocktype'],
      toolbar: 'blocktype | bold italic underline | justifyleft justifycenter justifyright | bullist numlist | link'
    });

    const instance = penman.get('#myTextarea');

    document.getElementById('btnSetContent').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.setContent('<p><b>This is dynamically set content!</b></p>');
    });

    document.getElementById('btnGetContent').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) alert("Editor Content: " + ed.getContent());
    });

    document.getElementById('btnFocus').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.focus();
    });

    document.getElementById('btnDestroy').addEventListener('click', () => {
      const ed = penman.get('#myTextarea');
      if(ed) ed.destroy();
    });

    // Listen to changes to verify sync
    const textarea = document.getElementById('myTextarea');
    setInterval(() => {
        console.log("Textarea value:", textarea.value);
    }, 5000);
  </script>
</body>
</html>
